# =============================================================================
# Nginx Hardened Configuration (nginx-unprivileged) - Blog/CMS
# MSSV: DTC245180035 - Họ và tên: Hà Đức Trung
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for unprivileged non-root execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Anonymized / Structured Access Log Format
    log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log custom_format;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 1. Hide Nginx Version
    server_tokens off;

    # 2. Maximum file upload size (matches 5MB image limit)
    client_max_body_size 6M;

    # 3. Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream Services
    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
    }

    upstream grafana_backend {
        server grafana:3000;
        keepalive 16;
    }

    # Rate Limiting Zones (Defense against Brute Force & DoS)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=comment_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=30r/m;
    limit_req_status 429;

    # =========================================================================
    # HTTP Server (Port 8080 -> Host Port 80) -> Permanent Redirect to HTTPS
    # =========================================================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        # Internal Nginx Status for Prometheus Scrape (Allowed on HTTP port 8080 within container network)
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS Server (Port 8443 -> Host Port 443) with TLSv1.2 & TLSv1.3 Only
    # =========================================================================
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name localhost;

        # SSL Certificate & Private Key
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Defense-in-Depth)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' wss: https:;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy Header Configuration
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_hide_header X-Powered-By;

        # 1. Protected Nginx Status (Private Scrape Only, Blocked from Public)
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # 2. Static Uploads (Serving Static Only, nosniff, No Execution)
        location /uploads/ {
            proxy_pass http://web_backend;
            proxy_cache_valid 200 1d;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=86400";
        }

        # 3. Protected Login with Rate Limiting (Brute Force Defense)
        location = /login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://web_backend;
            proxy_read_timeout 60s;
        }

        # 4. Search Endpoint with Rate Limiting
        location = /search {
            limit_req zone=search_limit burst=10 nodelay;

            proxy_pass http://web_backend;
            proxy_read_timeout 60s;
        }

        # 5. Comment Endpoint with Rate Limiting
        location ~ ^/posts/\d+/comments$ {
            limit_req zone=comment_limit burst=5 nodelay;

            proxy_pass http://web_backend;
            proxy_read_timeout 60s;
        }

        # 6. pgAdmin Management Console under /pgadmin/
        location /pgadmin/ {
            proxy_pass http://pgadmin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;
            proxy_read_timeout 600s;
        }

        # 7. Grafana Monitoring Dashboard under /grafana/
        location /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 600s;
        }

        # WebSocket support for Grafana Live
        location /grafana/api/live/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 600s;
        }

        # 8. Main Dynamic Blog/CMS Web Application
        location / {
            proxy_pass http://web_backend;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }
}

apiVersion: 1

groups:
  - orgId: 1
    name: "Security Alerts"
    folder: "BlogCMS Security"
    interval: 10s
    rules:
      - uid: "brute_force_login_rule"
        title: "BlogCMS - Brute force login"
        condition: "B"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "loki"
            model:
              editorMode: "code"
              expr: 'sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: "instant"
              refId: "A"

          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "classic_conditions"
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: "gt"
                  operator:
                    type: "and"
                  query:
                    params:
                      - "A"
                  reducer:
                    params: []
                    type: "last"

        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        annotations:
          summary: "Cảnh báo tấn công Brute Force vào BlogCMS"
          description: "Phát hiện hơn 5 lần đăng nhập thất bại (LOGIN_FAILED) trong vòng 1 phút. Dùng LogQL: {job=\"webapp\"} |= \"LOGIN_FAILED\" để truy vết IP nguồn và tài khoản bị nhắm tới."
        labels:
          severity: "critical"
          category: "security"
